<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>{{ business_name }}</title></head>
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#171717;">
  <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;">
    <tr><td style="padding:24px 28px;border-bottom:1px solid #e5e5e5;font-weight:bold;font-size:18px;">{{ business_name }}</td></tr>
    <tr><td style="padding:28px;font-size:15px;line-height:1.6;">{% block content %}{% endblock %}</td></tr>
    <tr><td style="padding:16px 28px;border-top:1px solid #e5e5e5;font-size:12px;color:#737373;">
      {% if business_address %}{{ business_address }}<br>{% endif %}Courriel automatique, merci de ne pas y répondre.
    </td></tr>
  </table>
</body>
</html>
