name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rdv
          POSTGRES_PASSWORD: rdv
          POSTGRES_DB: rdv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U rdv"
          --health-interval=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://rdv:rdv@localhost:5432/rdv_test
      JWT_SECRET: test-secret-test-secret-test-secret-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install --upgrade pip setuptools && pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy app scripts
      - run: alembic upgrade head && alembic check
      - run: pytest --cov=app --cov-fail-under=80
      - run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait backend
      - run: docker compose up -d frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Attendre le frontend
        run: for i in $(seq 1 60); do curl -sf http://localhost:3000 > /dev/null && exit 0; sleep 2; done; exit 1
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs backend frontend
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

  deploy:
    # Déploiement automatique quand tout est vert sur main (hooks Render / Vercel en secrets).
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Déployer l'API (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "RENDER_DEPLOY_HOOK_URL absent, étape ignorée"; fi
      - name: Déployer le frontend (Vercel)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "VERCEL_DEPLOY_HOOK_URL absent, étape ignorée"; fi
